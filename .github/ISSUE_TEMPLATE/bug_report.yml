name: Bug report
description: 报告代码、导航页或文档中的可复现错误
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢报告问题。请勿提交个人身份、学校信息、密钥或未公开竞赛材料。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行命令……
        2. 打开页面……
        3. 看到错误……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 项目版本或提交
      placeholder: v0.1.0 / commit SHA
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 和相关包版本；可粘贴 `cumcm-starter check-env` 的非敏感输出。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 我已移除个人信息、学校信息和密钥。
          required: true

